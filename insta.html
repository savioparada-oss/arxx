<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram PODERONE</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        background: #111;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(255,255,255,0.1);
        text-align: center;
        max-width: 400px;
        width: 90%;
    }

    h1 {
        color: white;
        margin-bottom: 10px;
    }

    p {
        color: #bbb;
        margin-bottom: 30px;
    }

    .botoes {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .btn {
        display: block;
        padding: 15px;
        background: #111;
        border: 1px solid white;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        background: white;
        color: black;
        transform: translateY(-2px);
    }

    .voltar {
        display: inline-block;
        margin-top: 25px;
        color: #bbb;
        text-decoration: none;
    }

    .voltar:hover {
        color: white;
        text-decoration: underline;
    }
</style>

</head>

<body>

<div class="container">

    <h1>
        Instagram PODERONE
    </h1>

    <p>
        Acesse nosso Instagram oficial.
    </p>

    <div class="botoes">

        <a class="btn" href="https://www.instagram.com/carlos.silva.adm.eng/" target="_blank">
            Carlos
        </a>

    </div>

    <a class="voltar" href="index.html">
        ← Voltar ao site
    </a>

</div>

</body>
</html>
