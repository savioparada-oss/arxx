<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp ARXX</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 15px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1ebe5d;
            transform: translateY(-2px);
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
            color: #555;
            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WhatsApp ARXX</h1>

        <p>
            Escolha com quem deseja entrar em contato pelo WhatsApp.
        </p>

        <div class="botoes">
            <a class="btn" href="https://wa.me/5531975659230" target="_blank">
                Carlos
            </a>

            <a class="btn" href="https://wa.me/5531992847464" target="_blank">
                William
            </a>
        </div>

        <a class="voltar" href="index.html">
            ← Voltar ao site
        </a>
    </div>

</body>
</html>
